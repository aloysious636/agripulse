<svg xmlns="http://www.w3.org/2000/svg" width="880" height="950" viewBox="0 0 880 950" font-family="Segoe UI, Arial, sans-serif"><title>Flowchart 3 — Notification generation (no duplicates)</title><rect width="880" height="950" fill="#ffffff"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f3d2a"/></marker></defs><text x="20" y="28" font-size="17" text-anchor="start" font-weight="bold" fill="#0f3d2a">Flowchart 3 — Notification generation (no duplicates)</text><rect x="140" y="70" width="180" height="44" rx="22" fill="#0f3d2a"/><text x="230" y="88.5" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">Trigger: save a record,</text><text x="230" y="103.5" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">open dashboard / alerts</text><line x1="230" y1="114" x2="230" y2="148" stroke="#0f3d2a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="100" y="148" width="260" height="44" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/><text x="230" y="166.58333333333334" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">Evaluate every enabled rule against</text><text x="230" y="181.08333333333334" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">live database records</text><line x1="230" y1="192" x2="230" y2="226" stroke="#0f3d2a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="100" y="226" width="260" height="44" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/><text x="230" y="244.58333333333334" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">Build candidate alerts, each with a</text><text x="230" y="259.08333333333337" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">stable key (rule + record id)</text><line x1="230" y1="270" x2="230" y2="304" stroke="#0f3d2a" stroke-width="1.6" marker-end="url(#arr)"/><polygon points="230,304 400,341.0 230,378 60,341.0" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/><text x="230" y="344.8333333333333" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">Key already stored?</text><text x="242" y="394" font-size="11" text-anchor="start" font-weight="bold" fill="#047857">Yes</text><line x1="230" y1="378" x2="230" y2="412" stroke="#0f3d2a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="100" y="412" width="260" height="44" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/><text x="230" y="430.5833333333333" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">Create new alert (or update text,</text><text x="230" y="445.0833333333333" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">level and due date in place)</text><line x1="230" y1="456" x2="230" y2="490" stroke="#0f3d2a" stroke-width="1.6" marker-end="url(#arr)"/><polygon points="230,490 400,527.0 230,564 60,527.0" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/><text x="230" y="523.5833333333334" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">Stored alert no longer a</text><text x="230" y="538.0833333333334" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">candidate?</text><text x="242" y="580" font-size="11" text-anchor="start" font-weight="bold" fill="#047857">Yes</text><line x1="230" y1="564" x2="230" y2="598" stroke="#0f3d2a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="100" y="598" width="260" height="44" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/><text x="230" y="616.5833333333334" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">Auto-resolve it (user-resolved ones</text><text x="230" y="631.0833333333334" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">are removed so they can recur)</text><line x1="230" y1="642" x2="230" y2="676" stroke="#0f3d2a" stroke-width="1.6" marker-end="url(#arr)"/><polygon points="230,676 400,713.0 230,750 60,713.0" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/><text x="230" y="709.5833333333334" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">User marked it resolved</text><text x="230" y="724.0833333333334" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">while condition persists?</text><text x="242" y="766" font-size="11" text-anchor="start" font-weight="bold" fill="#047857">Yes</text><line x1="230" y1="750" x2="230" y2="784" stroke="#0f3d2a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="100" y="784" width="260" height="44" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/><text x="230" y="802.5833333333334" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">Keep hidden — no duplicate is</text><text x="230" y="817.0833333333334" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">created</text><line x1="230" y1="828" x2="230" y2="862" stroke="#0f3d2a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="140" y="862" width="180" height="44" rx="22" fill="#0f3d2a"/><text x="230" y="873.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">Unread badge and</text><text x="230" y="888.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">Notifications page</text><text x="230" y="903.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">updated</text></svg>