<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1106" viewBox="0 0 880 1106" font-family="Segoe UI, Arial, sans-serif"><title>Flowchart 2 — Breeding cycle and automatic calculations</title><rect width="880" height="1106" fill="#ffffff"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f3d2a"/></marker></defs><text x="20" y="28" font-size="17" text-anchor="start" font-weight="bold" fill="#0f3d2a">Flowchart 2 — Breeding cycle and automatic calculations</text><rect x="140" y="70" width="180" height="44" rx="22" fill="#0f3d2a"/><text x="230" y="88.5" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">Start: record heat /</text><text x="230" y="103.5" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">service</text><line x1="230" y1="114" x2="230" y2="148" stroke="#0f3d2a" stroke-width="1.6" marker-end="url(#arr)"/><polygon points="100,192 125,148 365,148 340,192" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/><text x="230" y="166.58333333333334" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">Record service: animal, date,</text><text x="230" y="181.08333333333334" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">method, sire, cost</text><line x1="230" y1="192" x2="230" y2="226" stroke="#0f3d2a" stroke-width="1.6" marker-end="url(#arr)"/><polygon points="230,226 400,263.0 230,300 60,263.0" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/><text x="230" y="252.33333333333334" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">Female, born before</text><text x="230" y="266.83333333333337" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">service, no confirmed</text><text x="230" y="281.33333333333337" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">pregnancy?</text><line x1="400" y1="263.0" x2="460" y2="263.0" stroke="#0f3d2a" stroke-width="1.6" marker-end="url(#arr)"/><text x="430" y="257.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#b45309">No</text><rect x="460" y="239.0" width="190" height="48" rx="6" fill="#fff5f5" stroke="#b91c1c" stroke-width="1.5"/><text x="555" y="266.6666666666667" font-size="11" text-anchor="middle" font-weight="normal" fill="#22282b">Show error; nothing saved</text><text x="242" y="316" font-size="11" text-anchor="start" font-weight="bold" fill="#047857">Yes</text><line x1="230" y1="300" x2="230" y2="334" stroke="#0f3d2a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="100" y="334" width="260" height="44" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/><text x="230" y="345.3333333333333" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">Expected delivery = service date +</text><text x="230" y="359.8333333333333" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">species gestation days (or manual</text><text x="230" y="374.3333333333333" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">override)</text><line x1="230" y1="378" x2="230" y2="412" stroke="#0f3d2a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="100" y="412" width="260" height="44" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/><text x="230" y="423.3333333333333" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">Calendar + alerts: pregnancy check</text><text x="230" y="437.8333333333333" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">due (species days), expected</text><text x="230" y="452.3333333333333" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">delivery</text><line x1="230" y1="456" x2="230" y2="490" stroke="#0f3d2a" stroke-width="1.6" marker-end="url(#arr)"/><polygon points="100,534 125,490 365,490 340,534" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/><text x="230" y="515.8333333333334" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">Record pregnancy examination</text><line x1="230" y1="534" x2="230" y2="568" stroke="#0f3d2a" stroke-width="1.6" marker-end="url(#arr)"/><polygon points="230,568 400,605.0 230,642 60,605.0" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/><text x="230" y="608.8333333333334" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">Result = Pregnant?</text><line x1="400" y1="605.0" x2="460" y2="605.0" stroke="#0f3d2a" stroke-width="1.6" marker-end="url(#arr)"/><text x="430" y="599.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#b45309">No</text><rect x="460" y="581.0" width="190" height="48" rx="6" fill="#fff5f5" stroke="#b91c1c" stroke-width="1.5"/><text x="555" y="594.6666666666666" font-size="11" text-anchor="middle" font-weight="normal" fill="#22282b">Status Open → animal becomes</text><text x="555" y="608.6666666666666" font-size="11" text-anchor="middle" font-weight="normal" fill="#22282b">&#x27;due for service&#x27; after rest</text><text x="555" y="622.6666666666666" font-size="11" text-anchor="middle" font-weight="normal" fill="#22282b">period</text><text x="242" y="658" font-size="11" text-anchor="start" font-weight="bold" fill="#047857">Yes</text><line x1="230" y1="642" x2="230" y2="676" stroke="#0f3d2a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="100" y="676" width="260" height="44" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/><text x="230" y="694.5833333333334" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">Status = Pregnant; countdown alerts</text><text x="230" y="709.0833333333334" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">(Critical ≤ 3 days, High ≤ window)</text><line x1="230" y1="720" x2="230" y2="754" stroke="#0f3d2a" stroke-width="1.6" marker-end="url(#arr)"/><polygon points="100,798 125,754 365,754 340,798" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/><text x="230" y="779.8333333333334" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">Record birth: alive, dead, weights</text><line x1="230" y1="798" x2="230" y2="832" stroke="#0f3d2a" stroke-width="1.6" marker-end="url(#arr)"/><polygon points="230,832 400,869.0 230,906 60,869.0" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/><text x="230" y="865.5833333333334" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">Counts plausible for the</text><text x="230" y="880.0833333333334" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">species?</text><line x1="400" y1="869.0" x2="460" y2="869.0" stroke="#0f3d2a" stroke-width="1.6" marker-end="url(#arr)"/><text x="430" y="863.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#b45309">No</text><rect x="460" y="845.0" width="190" height="48" rx="6" fill="#fff5f5" stroke="#b91c1c" stroke-width="1.5"/><text x="555" y="872.6666666666666" font-size="11" text-anchor="middle" font-weight="normal" fill="#22282b">Show error; nothing saved</text><text x="242" y="922" font-size="11" text-anchor="start" font-weight="bold" fill="#047857">Yes</text><line x1="230" y1="906" x2="230" y2="940" stroke="#0f3d2a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="100" y="940" width="260" height="44" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/><text x="230" y="951.3333333333334" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">Link to service → status Delivered;</text><text x="230" y="965.8333333333334" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">recompute indicators (intervals,</text><text x="230" y="980.3333333333334" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">litter size)</text><line x1="230" y1="984" x2="230" y2="1018" stroke="#0f3d2a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="140" y="1018" width="180" height="44" rx="22" fill="#0f3d2a"/><text x="230" y="1036.5" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">Register offspring from</text><text x="230" y="1051.5" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">the birth record</text></svg>