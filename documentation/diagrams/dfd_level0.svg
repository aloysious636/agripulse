<svg xmlns="http://www.w3.org/2000/svg" width="980" height="585" viewBox="0 0 980 585" font-family="Segoe UI, Arial, sans-serif"><title>DFD level 0</title><rect width="980" height="585" fill="#ffffff"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f3d2a"/></marker></defs><text x="20" y="28" font-size="18" text-anchor="start" font-weight="bold" fill="#0f3d2a">AgriPulse — Data Flow Diagram, Level 0 (context)</text><circle cx="480" cy="300" r="125" fill="#ecfdf5" stroke="#047857" stroke-width="2.5"/><text x="480" y="238" font-size="14" text-anchor="middle" font-weight="bold" fill="#047857">0</text><text x="480" y="275" font-size="14" text-anchor="middle" font-weight="bold" fill="#22282b">AgriPulse</text><text x="480" y="294" font-size="14" text-anchor="middle" font-weight="bold" fill="#22282b">offline livestock</text><text x="480" y="313" font-size="14" text-anchor="middle" font-weight="bold" fill="#22282b">management</text><text x="480" y="332" font-size="14" text-anchor="middle" font-weight="bold" fill="#22282b">system</text><rect x="20" y="240" width="190" height="120" fill="#fff" stroke="#0f3d2a" stroke-width="2"/><text x="115.0" y="296.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#22282b">Farmer /</text><text x="115.0" y="312.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#22282b">farm manager</text><rect x="740" y="60" width="200" height="110" fill="#fff" stroke="#0f3d2a" stroke-width="2"/><text x="840.0" y="103.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#22282b">Extension officer,</text><text x="840.0" y="119.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#22282b">student, veterinarian</text><text x="840.0" y="135.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#22282b">(report recipients)</text><rect x="740" y="410" width="200" height="110" fill="#fff" stroke="#0f3d2a" stroke-width="2"/><text x="840.0" y="453.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#22282b">Local file system</text><text x="840.0" y="469.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#22282b">(backups, exports,</text><text x="840.0" y="485.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#22282b">photographs)</text><line x1="210" y1="275" x2="348.0" y2="275.0" stroke="#0f3d2a" stroke-width="1.6"/><polygon points="357.0,275.0 346.0,279.4 346.0,270.6" fill="#0f3d2a"/><text x="283" y="245" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#2b3a33">farm records,</text><text x="283" y="259" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#2b3a33">settings, requests</text><line x1="357" y1="335" x2="219.0" y2="335.0" stroke="#0f3d2a" stroke-width="1.6"/><polygon points="210.0,335.0 221.0,330.6 221.0,339.4" fill="#0f3d2a"/><text x="283" y="355" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#2b3a33">dashboard, alerts,</text><text x="283" y="369" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#2b3a33">calendar, results</text><line x1="572" y1="213" x2="732.0" y2="129.2" stroke="#0f3d2a" stroke-width="1.6"/><polygon points="740.0,125.0 732.3,134.0 728.2,126.2" fill="#0f3d2a"/><text x="596" y="150" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#2b3a33">PDF / CSV reports</text><text x="596" y="164" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#2b3a33">and printouts</text><line x1="572" y1="385" x2="731.5" y2="442.0" stroke="#0f3d2a" stroke-width="1.6"/><polygon points="740.0,445.0 728.2,445.4 731.1,437.2" fill="#0f3d2a"/><text x="672" y="385" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#2b3a33">backup .zip,</text><text x="672" y="399" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#2b3a33">photographs</text><line x1="740" y1="490" x2="556.3" y2="411.5" stroke="#0f3d2a" stroke-width="1.6"/><polygon points="548.0,408.0 559.8,408.3 556.4,416.4" fill="#0f3d2a"/><text x="612" y="482" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#2b3a33">restore file</text><text x="20" y="560" font-size="11" text-anchor="start" font-weight="normal" fill="#5b6561">Level 0 shows the whole system as one process; Level 1 (next figure) breaks it into eight processes and eight data stores.</text></svg>