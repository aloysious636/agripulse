<svg xmlns="http://www.w3.org/2000/svg" width="880" height="890" viewBox="0 0 880 890" font-family="Segoe UI, Arial, sans-serif"><title>Flowchart 4 — Backup and restore</title><rect width="880" height="890" fill="#ffffff"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f3d2a"/></marker></defs><text x="20" y="28" font-size="17" text-anchor="start" font-weight="bold" fill="#0f3d2a">Flowchart 4 — Backup and restore</text><rect x="140" y="70" width="180" height="44" rx="22" fill="#0f3d2a"/><text x="230" y="88.5" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">Backup: Settings ▸</text><text x="230" y="103.5" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">Backup &amp; restore</text><line x1="230" y1="114" x2="230" y2="148" stroke="#0f3d2a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="100" y="148" width="260" height="44" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/><text x="230" y="166.58333333333334" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">Take consistent snapshot using</text><text x="230" y="181.08333333333334" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">SQLite online backup API</text><line x1="230" y1="192" x2="230" y2="226" stroke="#0f3d2a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="100" y="226" width="260" height="44" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/><text x="230" y="244.58333333333334" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">Zip: database + manifest +</text><text x="230" y="259.08333333333337" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">photographs; write to backup folder</text><line x1="230" y1="270" x2="230" y2="304" stroke="#0f3d2a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="100" y="304" width="260" height="44" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/><text x="230" y="322.5833333333333" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">Prune old backups beyond the keep</text><text x="230" y="337.0833333333333" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">limit</text><line x1="230" y1="348" x2="230" y2="382" stroke="#0f3d2a" stroke-width="1.6" marker-end="url(#arr)"/><polygon points="100,426 125,382 365,382 340,426" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/><text x="230" y="400.5833333333333" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">Restore: choose a backup or upload</text><text x="230" y="415.0833333333333" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">a .zip</text><line x1="230" y1="426" x2="230" y2="460" stroke="#0f3d2a" stroke-width="1.6" marker-end="url(#arr)"/><polygon points="230,460 400,497.0 230,534 60,497.0" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/><text x="230" y="479.0833333333333" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">Valid zip, AgriPulse</text><text x="230" y="493.5833333333333" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">manifest, safe file</text><text x="230" y="508.0833333333333" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">names, integrity_check</text><text x="230" y="522.5833333333333" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">OK, schema not newer?</text><line x1="400" y1="497.0" x2="460" y2="497.0" stroke="#0f3d2a" stroke-width="1.6" marker-end="url(#arr)"/><text x="430" y="491.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#b45309">No</text><rect x="460" y="473.0" width="190" height="48" rx="6" fill="#fff5f5" stroke="#b91c1c" stroke-width="1.5"/><text x="555" y="493.6666666666667" font-size="11" text-anchor="middle" font-weight="normal" fill="#22282b">Reject; current data</text><text x="555" y="507.6666666666667" font-size="11" text-anchor="middle" font-weight="normal" fill="#22282b">untouched</text><text x="242" y="550" font-size="11" text-anchor="start" font-weight="bold" fill="#047857">Yes</text><line x1="230" y1="534" x2="230" y2="568" stroke="#0f3d2a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="100" y="568" width="260" height="44" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/><text x="230" y="593.8333333333334" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">Create safety backup of current data</text><line x1="230" y1="612" x2="230" y2="646" stroke="#0f3d2a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="100" y="646" width="260" height="44" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/><text x="230" y="664.5833333333334" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">Close connections, atomically</text><text x="230" y="679.0833333333334" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">replace database, restore photos</text><line x1="230" y1="690" x2="230" y2="724" stroke="#0f3d2a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="100" y="724" width="260" height="44" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/><text x="230" y="749.8333333333334" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">Run schema upgrade for older backups</text><line x1="230" y1="768" x2="230" y2="802" stroke="#0f3d2a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="140" y="802" width="180" height="44" rx="22" fill="#0f3d2a"/><text x="230" y="820.5" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">Restored — data persists</text><text x="230" y="835.5" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">after restart</text></svg>