<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1058" viewBox="0 0 880 1058" font-family="Segoe UI, Arial, sans-serif"><title>Flowchart 1 — Register an animal</title><rect width="880" height="1058" fill="#ffffff"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f3d2a"/></marker></defs><text x="20" y="28" font-size="17" text-anchor="start" font-weight="bold" fill="#0f3d2a">Flowchart 1 — Register an animal</text><rect x="140" y="70" width="180" height="44" rx="22" fill="#0f3d2a"/><text x="230" y="88.5" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">Start: Animals ▸</text><text x="230" y="103.5" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">Register animal</text><line x1="230" y1="114" x2="230" y2="148" stroke="#0f3d2a" stroke-width="1.6" marker-end="url(#arr)"/><polygon points="100,192 125,148 365,148 340,192" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/><text x="230" y="166.58333333333334" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">Enter tag, species, sex, breed,</text><text x="230" y="181.08333333333334" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">dates, weights, parents, photo</text><line x1="230" y1="192" x2="230" y2="226" stroke="#0f3d2a" stroke-width="1.6" marker-end="url(#arr)"/><polygon points="230,226 400,263.0 230,300 60,263.0" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/><text x="230" y="252.33333333333334" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">Required fields present</text><text x="230" y="266.83333333333337" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">and valid (dates,</text><text x="230" y="281.33333333333337" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">numbers, ranges)?</text><line x1="400" y1="263.0" x2="460" y2="263.0" stroke="#0f3d2a" stroke-width="1.6" marker-end="url(#arr)"/><text x="430" y="257.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#b45309">No</text><rect x="460" y="239.0" width="190" height="48" rx="6" fill="#fff5f5" stroke="#b91c1c" stroke-width="1.5"/><text x="555" y="259.6666666666667" font-size="11" text-anchor="middle" font-weight="normal" fill="#22282b">Show field errors; nothing</text><text x="555" y="273.6666666666667" font-size="11" text-anchor="middle" font-weight="normal" fill="#22282b">saved</text><text x="242" y="316" font-size="11" text-anchor="start" font-weight="bold" fill="#047857">Yes</text><line x1="230" y1="300" x2="230" y2="334" stroke="#0f3d2a" stroke-width="1.6" marker-end="url(#arr)"/><polygon points="230,334 400,371.0 230,408 60,371.0" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/><text x="230" y="367.5833333333333" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">Tag number unique (case-</text><text x="230" y="382.0833333333333" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">insensitive)?</text><line x1="400" y1="371.0" x2="460" y2="371.0" stroke="#0f3d2a" stroke-width="1.6" marker-end="url(#arr)"/><text x="430" y="365.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#b45309">No</text><rect x="460" y="347.0" width="190" height="48" rx="6" fill="#fff5f5" stroke="#b91c1c" stroke-width="1.5"/><text x="555" y="374.6666666666667" font-size="11" text-anchor="middle" font-weight="normal" fill="#22282b">Reject duplicate tag</text><text x="242" y="424" font-size="11" text-anchor="start" font-weight="bold" fill="#047857">Yes</text><line x1="230" y1="408" x2="230" y2="442" stroke="#0f3d2a" stroke-width="1.6" marker-end="url(#arr)"/><polygon points="230,442 400,479.0 230,516 60,479.0" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/><text x="230" y="468.3333333333333" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">Breed matches species;</text><text x="230" y="482.8333333333333" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">parents have right sex,</text><text x="230" y="497.3333333333333" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">species, age?</text><line x1="400" y1="479.0" x2="460" y2="479.0" stroke="#0f3d2a" stroke-width="1.6" marker-end="url(#arr)"/><text x="430" y="473.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#b45309">No</text><rect x="460" y="455.0" width="190" height="48" rx="6" fill="#fff5f5" stroke="#b91c1c" stroke-width="1.5"/><text x="555" y="482.6666666666667" font-size="11" text-anchor="middle" font-weight="normal" fill="#22282b">Show parent / breed error</text><text x="242" y="532" font-size="11" text-anchor="start" font-weight="bold" fill="#047857">Yes</text><line x1="230" y1="516" x2="230" y2="550" stroke="#0f3d2a" stroke-width="1.6" marker-end="url(#arr)"/><polygon points="230,550 400,587.0 230,624 60,587.0" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/><text x="230" y="576.3333333333334" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">Photo is a real</text><text x="230" y="590.8333333333334" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">PNG/JPEG/GIF/WebP under 5</text><text x="230" y="605.3333333333334" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">MB?</text><line x1="400" y1="587.0" x2="460" y2="587.0" stroke="#0f3d2a" stroke-width="1.6" marker-end="url(#arr)"/><text x="430" y="581.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#b45309">No</text><rect x="460" y="563.0" width="190" height="48" rx="6" fill="#fff5f5" stroke="#b91c1c" stroke-width="1.5"/><text x="555" y="590.6666666666666" font-size="11" text-anchor="middle" font-weight="normal" fill="#22282b">Reject upload; nothing saved</text><text x="242" y="640" font-size="11" text-anchor="start" font-weight="bold" fill="#047857">Yes</text><line x1="230" y1="624" x2="230" y2="658" stroke="#0f3d2a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="100" y="658" width="260" height="44" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/><text x="230" y="676.5833333333334" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">Save animal in one transaction;</text><text x="230" y="691.0833333333334" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">assign internal ID AP-000001</text><line x1="230" y1="702" x2="230" y2="736" stroke="#0f3d2a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="100" y="736" width="260" height="44" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/><text x="230" y="761.8333333333334" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">Store photo under a random file name</text><line x1="230" y1="780" x2="230" y2="814" stroke="#0f3d2a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="100" y="814" width="260" height="44" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/><text x="230" y="825.3333333333334" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">Weight entered? create dated weight</text><text x="230" y="839.8333333333334" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">record · Price entered? create</text><text x="230" y="854.3333333333334" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">linked &#x27;Animal purchases&#x27; expense</text><line x1="230" y1="858" x2="230" y2="892" stroke="#0f3d2a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="100" y="892" width="260" height="44" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/><text x="230" y="910.5833333333334" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">Refresh alerts (missing info,</text><text x="230" y="925.0833333333334" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#22282b">breeding due…)</text><line x1="230" y1="936" x2="230" y2="970" stroke="#0f3d2a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="140" y="970" width="180" height="44" rx="22" fill="#0f3d2a"/><text x="230" y="996.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">Show animal profile</text></svg>